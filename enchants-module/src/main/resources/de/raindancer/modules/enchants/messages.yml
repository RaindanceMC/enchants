# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
enchants:
  flight-empty: "<gray>Flight ran out. <white>Land and it recharges."
  flight-remaining: "<aqua>Flight <white><time></white> <gray>left"
  flight-remaining-low: "<red>Flight <white><time></white> <red>left — land soon!"
  usage: "<gray>/enchants <dark_gray>— list · <gray>/enchants give <player> <enchantment> [level] <dark_gray>— staff"
  list-header: "<gold>Rain's enchantments:"
  list-line: "<gray>- <white><name></white> <dark_gray>(up to <max>, on <gear>)"
  not-online: "<red><white><player></white> is not online right now."
  unknown: "<red>There is no enchantment <white><name></white>. <gray>/enchants list shows them."
  bad-level: "<red>The level has to be a number from 1 to <white><max></white>."
  given: "<green>Gave <white><player></white> a book of <white><name></white> <level>."
  boost-charges: "<aqua>Boost! <gray><white><left></white> of <white><of></white> charges left."
  boost-empty: "<gray>Boost is recharging. Next charge in <white><time></white>."
  launch-cooldown: "<gray>Launch is ready again in <white><time></white>."
  heat-seeking-locked: "<red>⌖ <gray>Locked on: <white><target></white>"
  soulbound-kept: "<light_purple>Soulbound kept <white><count></white> of your things with you."
  link-set: "<green>Linked to the chest at <white><x> <y> <z></white>. What this tool mines goes there now."
  link-denied: "<red>You can only link a chest you are allowed to open."
  link-missing: "<gray>This tool has Chest Link but no chest yet. <white>Sneak and right-click a chest</white> to link it."
  link-missed: "<gray>Your linked chest is full or gone, so what you mined came to you."
  link-elsewhere: "<gray>Your linked chest is not on this server, so what you mined came to you."
  portal-opened: "<light_purple>The portal hums open. <gray>It leads to the shard world, where it is always night."
  portal-denied: "<red>You cannot open a portal here: you may not build on this ground."
  portal-arrived: "<light_purple>The shard world. <gray>Monsters here drop the enchantments' shards. Any portal takes you back."
  shards-dropped: "<light_purple>+<amount> shard(s): <white><names>"
  shard-given: "<green>Gave <white><player></white> <white><amount></white> shard(s) of <white><name></white>."
  shard-usage: "<gray>/enchants shard <player> <enchantment> [amount] <dark_gray>— staff"
  shardmob-usage: "<gray>/enchants shardmob <mob> <player> <dark_gray>— staff: a creature of the shard world next to them"
  shardmob-unknown: "<red>There is no creature called <white><mob></white>."
  shardmob-made: "<green>A <white><mob></white> of the shard world came for <white><player></white>."
  shardmob-refused: "<red>No <white><mob></white> lives in the shard world, or the player is not there."
  give-done: "<green>Gave <white><count></white> × <white><item></white> to <white><who></white>."
  give-usage: "<gray>/give <player> <item> [count] <dark_gray>— also <white>telekinesis_shard</white>, <white>flight_book</white>, <white>flight_book_3</white>"
  players-only: "<red>Only a player can do that."
  autopilot-no-elytra: "<red>Put on an elytra with Autopilot first."
  autopilot-busy: "<red>Not now: <gray>not while flying creatively, riding something or swimming."
  autopilot-on: "<aqua>Autopilot on. <gray>Cruising at <white><speed></white> blocks a second (<white><mode></white>). You steer; fly level and it holds your altitude. <white>Sneak and scroll</white> for speed, <white>F</white> for economy, <white>tap sneak</white> to switch it off."
  autopilot-disengaged: "<aqua>Autopilot off. <gray>You have the controls."
  autopilot-landed: "<aqua>Touchdown. <gray>Autopilot is off."
  autopilot-lost: "<red>Autopilot off: <gray>the Autopilot elytra came off."
  autopilot-empty: "<gold>Out of rockets and Boost charges. <gray>Autopilot still holds your altitude; you glide on."
  autopilot-economy-on: "<aqua>Economy mode. <gray>As little fuel as it can, and your cruise speed when that allows."
  autopilot-economy-off: "<aqua>Cruise mode. <gray>Your cruise speed comes first."
  autopilot-cruise: "<aqua>Cruise speed: <white><speed></white> blocks a second."
  autopilot-usage: "<gray>Use <white>/autopilot</white>, <white>/autopilot economy</white> or <white>/autopilot speed 40</white> (blocks a second)."
  autopilot-hud: "<aqua><mode> <white><speed></white><gray>/<cruise> b/s · alt <white><altitude></white> · <fuel> <dark_gray>· sneak+scroll, F, tap sneak"
  heat-seeking-precise: "<red>Heat-seeking: <white>Precise</white> <gray>— it takes what your crosshair is on. <dark_gray>/heatseeking for wide"
  heat-seeking-wide: "<red>Heat-seeking: <white>Wide</white> <gray>— it finds something to hit near where you aim. <dark_gray>/heatseeking for precise"
