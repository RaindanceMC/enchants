id: enchants
title: Rain's Enchantments
summary: Enchantments you will not find at an enchanting table — how to earn shards, unlock a book and put it on your gear.
intro: |
  Vanilla enchantments are for people with no ambition. These you have to <i>earn</i>: shards from a night-soaked world full of monsters, a guild to unlock them, a book from the shop. I have the full list.
icon: ENCHANTED_BOOK
category: Items & enchantments
order: 20
